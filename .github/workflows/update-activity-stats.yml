name: Update profile activity cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate anonymized activity cards
        run: python3 scripts/generate-activity-stats.py

      - name: Commit updated cards
        run: |
          if git diff --quiet -- assets/activity-stats-dark.svg assets/activity-stats-light.svg assets/activity-stats-dark-mobile.svg assets/activity-stats-light-mobile.svg; then
            echo "Activity cards are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-stats-dark.svg assets/activity-stats-light.svg assets/activity-stats-dark-mobile.svg assets/activity-stats-light-mobile.svg
          git commit -m "chore: refresh GitHub activity cards"
          git push
