<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Frontend craft, full-stack thinking</title>
  <desc id="description">A typeset field record pairing Gowrish's frontend-to-full-stack story with five areas of product engineering work.</desc>
  <rect width="1200" height="300" fill="#17241D" />

  <text x="64" y="119" fill="#F2F0E7" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700" letter-spacing="-0.8">FULL-STACK THINKING</text>
  <text x="68" y="157" fill="#63C8AC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">FRONTEND CRAFT</text>
  <text x="68" y="196" fill="#D6D8C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Product experiences · APIs · Web3 systems</text>

  <line x1="694" y1="46" x2="694" y2="254" stroke="#728176" stroke-opacity="0.55" />
  <text x="736" y="57" fill="#82D5A2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">WORK ACROSS PRODUCTS</text>
