  <text x="736" y="105" fill="#F2F0E7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Web3 marketplace systems</text>
  <text x="736" y="139" fill="#F2F0E7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Blockchain platforms &amp; node deployment</text>
  <text x="736" y="173" fill="#F2F0E7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Multi-chain protocol integrations</text>
  <text x="736" y="207" fill="#F2F0E7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Reusable frontend &amp; UI systems</text>
  <text x="736" y="241" fill="#F2F0E7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Financial &amp; operational products</text>
